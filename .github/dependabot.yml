version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # TS 7 blocked: @astrojs/check and typescript-eslint don't support it yet.
      # Remove once they do.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for all minor/patch bumps; majors get their own PR each.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
